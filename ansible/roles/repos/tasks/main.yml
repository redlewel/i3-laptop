---
# Vendor apt repositories (deb822 format, keys fetched into /etc/apt/keyrings).
# All verified to serve `resolute` or a codename-less suite on 2026-10-12.

- name: Keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker repo
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  notify: apt update
  tags: [dev]

- name: VS Code repo
  ansible.builtin.deb822_repository:
    name: vscode
    types: [deb]
    uris: https://packages.microsoft.com/repos/code
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: https://packages.microsoft.com/keys/microsoft.asc
  notify: apt update
  tags: [dev]

- name: GitHub CLI repo
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: https://cli.github.com/packages
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
  notify: apt update
  tags: [dev]

- name: Tailscale repo
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main]
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg"
  notify: apt update
  tags: [work]

- name: Brave repo
  ansible.builtin.deb822_repository:
    name: brave-browser
    types: [deb]
    uris: https://brave-browser-apt-release.s3.brave.com/
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
  notify: apt update
  tags: [work]

- name: Flush handlers so apt sees the new repos before packages install
  ansible.builtin.meta: flush_handlers
